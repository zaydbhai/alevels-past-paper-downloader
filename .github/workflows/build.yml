name: Build Executables

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: ALevels-PastPaper-Downloader-Linux
            sep: ":"
            pyinstaller_args: '--icon=icon.png'
          - os: windows-latest
            artifact_name: ALevels-PastPaper-Downloader-Windows.exe
            sep: ";"
            pyinstaller_args: ''
          - os: macos-latest
            artifact_name: ALevels-PastPaper-Downloader-macOS
            sep: ":"
            pyinstaller_args: ''

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install customtkinter cloudscraper beautifulsoup4 pyinstaller

      - name: Build Executable
        shell: bash
        run: |
          pyinstaller --noconsole --onefile \
            --name="${{ matrix.artifact_name }}" \
            --add-data "icon.png${{ matrix.sep }}." \
            --collect-all customtkinter \
            ${{ matrix.pyinstaller_args }} \
            alevel_downloader.py

      - name: Upload Artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
